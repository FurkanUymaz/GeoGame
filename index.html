<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeoGame - Web GIS Football Tic-Tac-Toe</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-badge">WEB GIS</span>
      <h1>GeoGame</h1>
    </div>
    <div id="turn-indicator" class="turn-banner">Player Setup</div>
    <div class="topbar-actions">
      <button type="button" id="btn-back-names" class="nav-btn hidden">Edit Players</button>
      <button type="button" id="btn-back-map" class="nav-btn hidden">World Map</button>
      <button type="button" id="btn-new-grid" class="nav-btn nav-btn-primary hidden">New Grid</button>
    </div>
  </header>

  <main class="app-shell">
    <section id="stage-players" class="stage active">
      <input type="text" id="input-player-x" maxlength="24">
      <input type="text" id="input-player-o" maxlength="24">
      <button type="button" id="btn-start-map">Continue to World Map</button>
    </section>

    <section id="stage-map" class="stage">
      <div class="map-top-bar">
        <div class="selection-pills">
          <span id="pill-horizontal" class="pill empty">Horizontal: None</span>
          <span id="pill-vertical" class="pill empty">Vertical: None</span>
          <span id="map-instruction" class="map-instruction">Select one country for Horizontal axis.</span>
        </div>
        <div class="map-actions">
          <button type="button" id="btn-clear-countries" class="btn-secondary">Clear</button>
          <button type="button" id="btn-enter-game" class="btn-primary" disabled>Start Game</button>
        </div>
      </div>

      <div class="map-workspace">
        <div class="map-canvas-card">
          <div class="map-controls-bar">
            <div class="region-presets">
              <button type="button" class="region-btn active" data-region="world">World</button>
              <button type="button" class="region-btn" data-region="europe">Europe</button>
              <button type="button" class="region-btn" data-region="americas">Americas</button>
              <button type="button" class="region-btn" data-region="asia">Asia &amp; Pacific</button>
            </div>
            <div class="zoom-controls">
              <button type="button" id="btn-zoom-out" class="zoom-btn" title="Zoom Out">-</button>
              <span id="zoom-level-badge" class="zoom-badge">1.0x</span>
              <button type="button" id="btn-zoom-in" class="zoom-btn" title="Zoom In">+</button>
              <button type="button" id="btn-zoom-reset" class="zoom-btn zoom-reset">Reset</button>
            </div>
          </div>

          <div class="canvas-wrapper">
            <canvas id="world-canvas"></canvas>
            <div id="map-tooltip" class="hidden"></div>
          </div>
        </div>

        <aside class="country-drawer">
          <div class="drawer-header">
            <h2>Leagues &amp; Nations</h2>
            <span id="drawer-count" class="drawer-count">0</span>
          </div>
          <input type="text" id="country-search-input" placeholder="Search country, league, confederation..." autocomplete="off">
          <ul id="country-list" class="country-list"></ul>
        </aside>
      </div>
    </section>

    <section id="stage-game" class="stage">
      <div class="game-layout">
        <div class="scoreboard-bar">
          <div id="card-x" class="player-score-card card-x">
            <span class="mark-tag mark-x">X</span>
            <span id="label-player-x" class="player-name">Player 1</span>
            <span id="score-x" class="player-score">0</span>
          </div>

          <div class="match-meta-card">
            <div id="meta-horizontal" class="meta-line">Horizontal: -</div>
            <div id="meta-vertical" class="meta-line">Vertical: -</div>
          </div>

          <div id="card-o" class="player-score-card card-o">
            <span class="mark-tag mark-o">O</span>
            <span id="label-player-o" class="player-name">Player 2</span>
            <span id="score-o" class="player-score">0</span>
          </div>
        </div>

        <div class="board-container">
          <div class="tic-grid">
            <div class="grid-corner">GEO<br>GRID</div>
            <div id="col-0" class="grid-header col-header"></div>
            <div id="col-1" class="grid-header col-header"></div>
            <div id="col-2" class="grid-header col-header"></div>

            <div id="row-0" class="grid-header row-header"></div>
            <button type="button" id="cell-0-0" class="grid-cell" data-r="0" data-c="0"></button>
            <button type="button" id="cell-0-1" class="grid-cell" data-r="0" data-c="1"></button>
            <button type="button" id="cell-0-2" class="grid-cell" data-r="0" data-c="2"></button>

            <div id="row-1" class="grid-header row-header"></div>
            <button type="button" id="cell-1-0" class="grid-cell" data-r="1" data-c="0"></button>
            <button type="button" id="cell-1-1" class="grid-cell" data-r="1" data-c="1"></button>
            <button type="button" id="cell-1-2" class="grid-cell" data-r="1" data-c="2"></button>

            <div id="row-2" class="grid-header row-header"></div>
            <button type="button" id="cell-2-0" class="grid-cell" data-r="2" data-c="0"></button>
            <button type="button" id="cell-2-1" class="grid-cell" data-r="2" data-c="1"></button>
            <button type="button" id="cell-2-2" class="grid-cell" data-r="2" data-c="2"></button>
          </div>
        </div>

        <div class="game-footer-bar">
          <div id="status-message" class="status-message">Pick a cell to start.</div>
          <button type="button" id="btn-skip" class="btn-secondary">Pass Turn</button>
        </div>
      </div>
    </section>
  </main>

  <div id="guess-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-top">
        <div>
          <span class="modal-eyebrow">Club Intersection</span>
          <h3 id="modal-matchup">Club A &times; Club B</h3>
        </div>
        <button type="button" id="btn-close-modal" class="modal-close-btn" aria-label="Close">&times;</button>
      </div>
      <div class="modal-input-row">
        <input type="text" id="player-input" placeholder="Type footballer name..." autocomplete="off">
        <button type="button" id="btn-submit-guess" class="btn-primary">Guess</button>
      </div>
      <ul id="autocomplete-list" class="autocomplete-list"></ul>
      <div id="modal-feedback" class="modal-feedback"></div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
